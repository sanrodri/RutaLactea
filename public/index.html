<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ruta Lactea </title>
   
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
    <link  rel="stylesheet"  href="/css/style.css">
   
    
</head>
<body>


<div class="container">
    <div class="form-content">
        <h1 id="title">Nueva entrega</h1>

        <form>
            <div class="input-group">

                <fieldset class="input-field" id="routeSelectionInput">
                    <legend>
                        Ruta de reparto
                    </legend>
                    <label>
                        <input type="radio"  id="routeSelectionFenicia" name="routeSelection_name" value="fenicia" required>
                        <img class="pin" src="/assets/pin-fenicia.png" alt="pin">
                        Fenicia
                    </label>

                    <label>
                        <input type="radio"  id="routeSelectionOvero" name="routeSelection_name" value="overo" required>
                        <img class="pin" src="/assets/pin-overo.png" alt="pin">
                        El Overo
                    </label>
                </fieldset>

                <div class="input-field" id="clientInput">
                    <label>
                        Cliente
                        <input type="text"  id="client" name="client_name" placeholder="Ej. Tienda de Juan" required>
                    </label>
                </div>

                <div class="input-field" id="milkQuantityInput">
                    <label>
                        Cantidad de leche
                        <input type="number"  id="milkQuantity" name="milkQuantity_name" placeholder="0" min="0" required>
                    </label>
                </div>

                <div class="input-field" id="milkPriceInput">
                    <label>
                        Precio por litro
                        <input type="number"  id="milkPrice" name="milkPrice_name" placeholder="0" min="0" required>
                    </label>
                </div>

                <div class="input-field" id="deliveryDateInput">
                    <label>
                        Fecha de entrega
                        <input type="date"  id="deliveryDate" name="deliveryDate_name" required>
                    </label>
                </div>
                <div class="total-field">
                    <span>Total a cobrar</span>
                    <p id="totalAmount">$ 0</p>
                    <small id="totalDetail">Ingresa litros y precio</small>
                </div>
                <div class="button-field">
                    <button  id="registerButton" type="submit">
                        <img class="truck" src="/assets/camion.png" alt="camion">
                        Registrar entrega
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>
        

 <script src="/controllers/script.js"></script>
</body>
</html>
